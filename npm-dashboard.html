<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waelio NPM Downloads Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0e1a;
      --bg-card: #111827;
      --bg-card-hover: #1a2236;
      --border: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-up: #22c55e;
      --accent-up-bg: rgba(34, 197, 94, 0.1);
      --accent-down: #ef4444;
      --accent-down-bg: rgba(239, 68, 68, 0.1);
      --accent-same: #eab308;
      --accent-same-bg: rgba(234, 179, 8, 0.1);
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --gradient-1: linear-gradient(135deg, #3b82f6, #8b5cf6);
      --gradient-2: linear-gradient(135deg, #06b6d4, #3b82f6);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(59,130,246,0.06) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(139,92,246,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      position: relative;
      z-index: 1;
    }

    /* ── Header ───────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.03em;
    }
    header p {
      color: var(--text-secondary);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }
    #last-updated {
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }

    /* ── Summary Cards ────────────────────────────────── */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .summary-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }
    .summary-card .label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .summary-card .value {
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }
    .summary-card .sub {
      font-size: 0.82rem;
      margin-top: 0.2rem;
    }
    .up   { color: var(--accent-up); }
    .down { color: var(--accent-down); }
    .same { color: var(--accent-same); }

    /* ── Controls ──────────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .controls button {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      transition: all 0.15s;
    }
    .controls button:hover,
    .controls button.active {
      background: var(--accent-blue);
      color: #fff;
      border-color: var(--accent-blue);
    }
    .controls .spacer { flex: 1; }
    #refreshBtn {
      background: var(--gradient-1);
      color: #fff;
      border: none;
      font-weight: 600;
    }
    #refreshBtn:hover { opacity: 0.9; }

    /* ── Sparkline Chart Area ─────────────────────────── */
    .chart-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .chart-section h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }
    #main-chart {
      width: 100%;
      height: 260px;
    }

    /* ── Package Table ─────────────────────────────────── */
    .table-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }
    .table-wrap h2 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 1.25rem 1.5rem 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    thead th {
      text-align: left;
      padding: 0.9rem 1.5rem;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      transition: color 0.15s;
    }
    thead th:hover { color: var(--text-primary); }
    thead th .sort-arrow { margin-left: 4px; opacity: 0.5; }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg-card-hover); }
    tbody td {
      padding: 0.85rem 1.5rem;
      font-size: 0.88rem;
    }
    .pkg-name {
      font-weight: 600;
      color: var(--accent-cyan);
    }
    .sparkline-cell canvas {
      vertical-align: middle;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.up   { background: var(--accent-up-bg);   color: var(--accent-up); }
    .badge.down { background: var(--accent-down-bg); color: var(--accent-down); }
    .badge.same { background: var(--accent-same-bg); color: var(--accent-same); }

    .pct { font-size: 0.78rem; color: var(--text-muted); margin-left: 6px; }

    /* ── Loading ───────────────────────────────────────── */
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem;
      gap: 1rem;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 640px) {
      header h1 { font-size: 1.5rem; }
      .summary-row { grid-template-columns: 1fr 1fr; }
      tbody td, thead th { padding: 0.65rem 0.75rem; font-size: 0.8rem; }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="container">
    <header>
      <h1>📦 Waelio NPM Dashboard</h1>
      <p>Real-time download analytics for all published packages</p>
      <div id="last-updated"></div>
    </header>

    <div class="summary-row" id="summary-row">
      <!-- filled by JS -->
    </div>

    <div class="controls">
      <button data-range="7">1 Week</button>
      <button class="active" data-range="14">2 Weeks</button>
      <button data-range="30">1 Month</button>
      <button data-range="90">3 Months</button>
      <span class="spacer"></span>
      <button id="refreshBtn">⟳ Refresh</button>
    </div>

    <div class="chart-section">
      <h2>Daily Downloads (All Packages Combined)</h2>
      <canvas id="main-chart"></canvas>
    </div>

    <div class="table-wrap">
      <h2>Package Breakdown</h2>
      <div id="table-container">
        <div class="loader"><div class="spinner"></div><span style="color:var(--text-muted);font-size:0.85rem">Loading data from NPM…</span></div>
      </div>
    </div>
  </div>

  <script>
    const PACKAGES = [
      '@waelio/cli', '@waelio/builder', '@waelio/agent', '@waelio/utils',
      '@waelio/ustore', '@waelio/messaging', '@waelio/sync', '@waelio/data',
      '@waelio/negotiate', 'waelio-utils', 'quasar-app-extension-waelio'
    ];

    let currentRange = 14;
    let allData = {};

    // ── Fetch ────────────────────────────────────────────
    async function fetchRange(pkg, days) {
      const end = new Date();
      const start = new Date();
      start.setDate(end.getDate() - days);
      const s = start.toISOString().split('T')[0];
      const e = end.toISOString().split('T')[0];
      const res = await fetch(`https://api.npmjs.org/downloads/range/${s}:${e}/${pkg}`);
      return res.json();
    }

    async function loadAll(days) {
      currentRange = days;
      const results = await Promise.all(PACKAGES.map(p => fetchRange(p, days)));
      allData = {};
      results.forEach(r => {
        if (r && r.downloads) {
          allData[r.package] = r.downloads;
        }
      });
      render();
      document.getElementById('last-updated').textContent = `Updated: ${new Date().toLocaleString()}`;
    }

    // ── Compute stats ────────────────────────────────────
    function computeStats(downloads) {
      if (!downloads || downloads.length < 2) return null;
      const total = downloads.reduce((s, d) => s + d.downloads, 0);
      const half = Math.floor(downloads.length / 2);
      const prevHalf = downloads.slice(0, half);
      const lastHalf = downloads.slice(half);
      const prevSum = prevHalf.reduce((s, d) => s + d.downloads, 0);
      const lastSum = lastHalf.reduce((s, d) => s + d.downloads, 0);
      const diff = lastSum - prevSum;
      const pct = prevSum > 0 ? ((diff / prevSum) * 100).toFixed(1) : (lastSum > 0 ? 100 : 0);
      return { total, prevSum, lastSum, diff, pct, daily: downloads };
    }

    // ── Render ────────────────────────────────────────────
    function render() {
      const stats = {};
      let grandPrev = 0, grandLast = 0, grandTotal = 0;

      for (const pkg of PACKAGES) {
        const s = computeStats(allData[pkg]);
        if (s) {
          stats[pkg] = s;
          grandPrev += s.prevSum;
          grandLast += s.lastSum;
          grandTotal += s.total;
        }
      }

      // Summary cards
      const grandDiff = grandLast - grandPrev;
      const grandPct = grandPrev > 0 ? ((grandDiff / grandPrev) * 100).toFixed(1) : 0;
      const trending = Object.entries(stats).sort((a, b) => b[1].diff - a[1].diff);
      const topUp = trending[0];
      const topDown = trending[trending.length - 1];
      const upCount = trending.filter(([, s]) => s.diff > 0).length;
      const downCount = trending.filter(([, s]) => s.diff < 0).length;

      document.getElementById('summary-row').innerHTML = `
        <div class="summary-card">
          <div class="label">Total Downloads</div>
          <div class="value">${grandTotal.toLocaleString()}</div>
          <div class="sub ${grandDiff >= 0 ? 'up' : 'down'}">${grandDiff >= 0 ? '▲' : '▼'} ${Math.abs(grandDiff).toLocaleString()} (${grandPct}%)</div>
        </div>
        <div class="summary-card">
          <div class="label">Trending Up</div>
          <div class="value up">${upCount}</div>
          <div class="sub" style="color:var(--text-muted)">${topUp ? topUp[0] : '—'}</div>
        </div>
        <div class="summary-card">
          <div class="label">Trending Down</div>
          <div class="value down">${downCount}</div>
          <div class="sub" style="color:var(--text-muted)">${topDown ? topDown[0] : '—'}</div>
        </div>
        <div class="summary-card">
          <div class="label">Packages</div>
          <div class="value" style="color:var(--accent-cyan)">${Object.keys(stats).length}</div>
          <div class="sub" style="color:var(--text-muted)">Tracked</div>
        </div>
      `;

      // Main chart
      drawMainChart(stats);

      // Table
      renderTable(stats);
    }

    // ── Main Chart (Canvas) ──────────────────────────────
    function drawMainChart(stats) {
      const canvas = document.getElementById('main-chart');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      const W = rect.width;
      const H = rect.height;
      ctx.clearRect(0, 0, W, H);

      // Aggregate daily
      const dayMap = {};
      for (const pkg in stats) {
        for (const d of stats[pkg].daily) {
          dayMap[d.day] = (dayMap[d.day] || 0) + d.downloads;
        }
      }
      const days = Object.keys(dayMap).sort();
      const values = days.map(d => dayMap[d]);
      if (values.length < 2) return;

      const max = Math.max(...values, 1);
      const padT = 20, padB = 30, padL = 50, padR = 20;
      const chartW = W - padL - padR;
      const chartH = H - padT - padB;

      // Grid lines
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = padT + (chartH / 4) * i;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(W - padR, y);
        ctx.stroke();
        // Label
        ctx.fillStyle = '#64748b';
        ctx.font = '11px Inter, sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(Math.round(max - (max / 4) * i), padL - 8, y + 4);
      }

      // X labels
      ctx.fillStyle = '#64748b';
      ctx.font = '10px Inter, sans-serif';
      ctx.textAlign = 'center';
      const step = Math.max(1, Math.floor(days.length / 7));
      for (let i = 0; i < days.length; i += step) {
        const x = padL + (i / (days.length - 1)) * chartW;
        const label = days[i].slice(5); // MM-DD
        ctx.fillText(label, x, H - 8);
      }

      // Line + gradient fill
      const pts = values.map((v, i) => ({
        x: padL + (i / (values.length - 1)) * chartW,
        y: padT + chartH - (v / max) * chartH
      }));

      // Fill
      const grad = ctx.createLinearGradient(0, padT, 0, padT + chartH);
      grad.addColorStop(0, 'rgba(59,130,246,0.25)');
      grad.addColorStop(1, 'rgba(59,130,246,0.0)');
      ctx.beginPath();
      ctx.moveTo(pts[0].x, padT + chartH);
      pts.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.lineTo(pts[pts.length - 1].x, padT + chartH);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // Line
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) {
        const cp1x = (pts[i - 1].x + pts[i].x) / 2;
        ctx.bezierCurveTo(cp1x, pts[i - 1].y, cp1x, pts[i].y, pts[i].x, pts[i].y);
      }
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Dots
      pts.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#3b82f6';
        ctx.fill();
      });
    }

    // ── Table ─────────────────────────────────────────────
    let sortCol = 'diff';
    let sortDir = -1;

    function renderTable(stats) {
      const entries = Object.entries(stats).map(([pkg, s]) => ({ pkg, ...s }));
      entries.sort((a, b) => {
        const va = a[sortCol] ?? 0;
        const vb = b[sortCol] ?? 0;
        return (va - vb) * sortDir;
      });

      const arrow = dir => dir === 1 ? '▲' : '▼';

      const colDef = [
        { key: 'pkg',     label: 'Package' },
        { key: 'total',   label: 'Total' },
        { key: 'prevSum', label: `First Half` },
        { key: 'lastSum', label: `Second Half` },
        { key: 'diff',    label: 'Change' },
        { key: 'spark',   label: 'Trend' },
      ];

      let html = '<table><thead><tr>';
      colDef.forEach(c => {
        const isSorted = sortCol === c.key;
        html += `<th data-col="${c.key}">${c.label}${isSorted ? `<span class="sort-arrow">${arrow(sortDir)}</span>` : ''}</th>`;
      });
      html += '</tr></thead><tbody>';

      entries.forEach(e => {
        const cls = e.diff > 0 ? 'up' : e.diff < 0 ? 'down' : 'same';
        const icon = e.diff > 0 ? '▲' : e.diff < 0 ? '▼' : '—';
        const sign = e.diff > 0 ? '+' : '';
        html += `<tr>
          <td class="pkg-name">${e.pkg}</td>
          <td>${e.total.toLocaleString()}</td>
          <td>${e.prevSum.toLocaleString()}</td>
          <td>${e.lastSum.toLocaleString()}</td>
          <td><span class="badge ${cls}">${icon} ${sign}${e.diff.toLocaleString()}</span><span class="pct">${sign}${e.pct}%</span></td>
          <td class="sparkline-cell"><canvas data-pkg="${e.pkg}" width="100" height="28"></canvas></td>
        </tr>`;
      });

      html += '</tbody></table>';
      document.getElementById('table-container').innerHTML = html;

      // Draw sparklines
      entries.forEach(e => {
        const canvas = document.querySelector(`canvas[data-pkg="${CSS.escape(e.pkg)}"]`);
        if (canvas) drawSparkline(canvas, e.daily);
      });

      // Sort click handlers
      document.querySelectorAll('thead th').forEach(th => {
        th.addEventListener('click', () => {
          const col = th.dataset.col;
          if (col === 'spark' || col === 'pkg') return;
          if (sortCol === col) sortDir *= -1;
          else { sortCol = col; sortDir = -1; }
          renderTable(stats);
        });
      });
    }

    function drawSparkline(canvas, daily) {
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      canvas.width = 100 * dpr;
      canvas.height = 28 * dpr;
      ctx.scale(dpr, dpr);
      const vals = daily.map(d => d.downloads);
      const max = Math.max(...vals, 1);
      const W = 100, H = 28, pad = 2;

      const first = vals[0], last = vals[vals.length - 1];
      const color = last >= first ? '#22c55e' : '#ef4444';

      ctx.beginPath();
      vals.forEach((v, i) => {
        const x = pad + (i / (vals.length - 1)) * (W - pad * 2);
        const y = pad + (H - pad * 2) - (v / max) * (H - pad * 2);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // ── Controls ─────────────────────────────────────────
    document.querySelectorAll('.controls button[data-range]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.controls button[data-range]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadAll(parseInt(btn.dataset.range));
      });
    });
    document.getElementById('refreshBtn').addEventListener('click', () => loadAll(currentRange));

    // Resize
    window.addEventListener('resize', () => { if (Object.keys(allData).length) render(); });

    // Init
    loadAll(14);
  </script>
</body>
</html>
