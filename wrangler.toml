# Cloudflare Pages configuration for waelio.com
name = "waelio-com"
pages_build_output_dir = "public"
compatibility_date = "2026-05-05"
compatibility_flags = ["nodejs_compat"]

# KV namespace binding for the private ledger storage
[[kv_namespaces]]
binding = "WAELIO_PRIVATE"
id = "76f81e03e097497a84e5c86ea944d829"

# Optional R2 bucket binding for Cloudflare Pages / Workers.
# Uncomment and fill in your R2 bucket name if you want native R2 access.
# [[r2_buckets]]
# binding = "WAELIO_R2"
# bucket_name = "your-bucket-name"
