<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>waelio.com – Open Source npm Package Stats</title>
    <meta
      name="description"
      content="Live npm package stats for @waelio/messaging, @waelio/ustore, and waelio-utils. View version info, weekly downloads, badges, and more."
    />
    <meta name="author" content="waelio" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://waelio.com/" />
    <meta name="theme-color" content="#111827" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="waelio.com – Open Source npm Package Stats"
    />
    <meta
      property="og:description"
      content="Live npm package stats for @waelio/messaging, @waelio/ustore, and waelio-utils."
    />
    <meta property="og:url" content="https://waelio.com/" />
    <meta property="og:site_name" content="waelio.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="waelio.com – Open Source npm Package Stats"
    />
    <meta
      name="twitter:description"
      content="Live npm package stats for @waelio/messaging, @waelio/ustore, and waelio-utils."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "waelio.com",
        "url": "https://waelio.com/",
        "description": "Live npm package stats for @waelio/messaging, @waelio/ustore, and waelio-utils.",
        "author": {
          "@type": "Person",
          "name": "waelio"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <div class="site-branding">
        <img
          src="/favicon.svg"
          alt="waelio logo"
          class="brand-logo brand-logo-main"
        />
        <h1>waelio.com – Package stats</h1>
      </div>
      <div class="header-nav">
        <span class="muted">Live npm metadata</span>
        <a href="/private" class="nav-link">🔒 Private</a>
      </div>
    </header>
    <div class="container">
      <div class="card" id="pkg-messaging">
        <h2>@waelio/messaging</h2>
        <div class="muted" id="msg-desc">Loading…</div>
        <div class="row">
          <span class="label">Latest:</span>
          <span class="val" id="msg-ver">—</span>
        </div>
        <div class="row">
          <span class="label">Last week:</span>
          <span class="val" id="msg-dl">—</span>
        </div>
        <div class="row">
          <span class="label">Links:</span> <span id="msg-links">—</span>
        </div>
        <div class="badges" id="msg-badges"></div>
        <div class="row">
          <span class="label">Tags:</span
          ><span id="msg-tags"><span class="muted">—</span></span>
        </div>
        <div class="error" id="msg-error"></div>
      </div>
      <div class="card" id="pkg-ustore">
        <h2>@waelio/ustore</h2>
        <div class="muted" id="ust-desc">Loading…</div>
        <div class="row">
          <span class="label">Latest:</span>
          <span class="val" id="ust-ver">—</span>
        </div>
        <div class="row">
          <span class="label">Last week:</span>
          <span class="val" id="ust-dl">—</span>
        </div>
        <div class="row">
          <span class="label">Links:</span> <span id="ust-links">—</span>
        </div>
        <div class="badges" id="ust-badges"></div>
        <div class="row">
          <span class="label">Tags:</span
          ><span id="ust-tags"><span class="muted">—</span></span>
        </div>
        <div class="error" id="ust-error"></div>
      </div>
      <div class="card" id="pkg-utils">
        <h2>waelio-utils</h2>
        <div class="muted" id="util-desc">Loading…</div>
        <div class="row">
          <span class="label">Latest:</span>
          <span class="val" id="util-ver">—</span>
        </div>
        <div class="row">
          <span class="label">Last week:</span>
          <span class="val" id="util-dl">—</span>
        </div>
        <div class="row">
          <span class="label">Links:</span> <span id="util-links">—</span>
        </div>
        <div class="badges" id="util-badges"></div>
        <div class="row">
          <span class="label">Tags:</span
          ><span id="util-tags"><span class="muted">—</span></span>
        </div>
        <div class="error" id="util-error"></div>
      </div>
    </div>
    <script src="/app.js" defer></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/service-worker.js");
        });
      }
    </script>
  </body>
</html>
