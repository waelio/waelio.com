<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>waelio.com – Open Source npm Package Stats</title>
    <meta
      name="description"
      content="Live npm package stats for @waelio/messaging, @waelio/ustore, and waelio-utils. View version info, weekly downloads, badges, and more."
    />
    <meta name="author" content="waelio" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://waelio.com/" />
    <meta name="theme-color" content="#dbe1e8" />
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("waelio-theme");
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const themeColors = {
            dim: "#dbe1e8",
            light: "#f4f7fb",
            dark: "#171d2c",
          };
          const theme =
            storedTheme === "light" ||
            storedTheme === "dim" ||
            storedTheme === "dark"
              ? storedTheme
              : prefersDark
                ? "dark"
                : "dim";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme =
            theme === "dark" ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", themeColors[theme]);
        } catch {
          document.documentElement.dataset.theme = "dim";
          document.documentElement.style.colorScheme = "light";
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", "#dbe1e8");
        }
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="waelio.com – Open Source npm Package Stats"
    />
    <meta
      property="og:description"
      content="Live npm package stats for @waelio/messaging, @waelio/ustore, and waelio-utils."
