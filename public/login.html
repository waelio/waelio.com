<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login – waelio.com</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-logo">
          <img
            src="/logo.svg"
            alt="waelio logo"
            class="brand-lockup brand-lockup-auth"
          />
        </div>
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-subtitle">
          Use your approved Google account to open your private workspace.
        </p>

        <div id="google-btn-wrapper" class="google-signin-wrapper">
          <div id="google-btn"></div>
        </div>

        <div id="login-error" class="auth-error" hidden></div>

        <a href="/" class="auth-back">← Back to waelio.com</a>
        <div class="legal-links">
          <a href="/privacy.html">Privacy Policy</a>
          <a href="/terms.html">Terms of Service</a>
        </div>
      </div>
    </div>

    <script>
      const errorEl = document.getElementById("login-error");
      const googleBtnWrapper = document.getElementById("google-btn-wrapper");

      function showError(message) {
        errorEl.textContent = message;
        errorEl.hidden = false;
      }

      function initGoogleSignIn() {
        fetch("/api/config")
          .then(async (response) => {
            if (!response.ok) {
              throw new Error(
                "Authentication backend is not deployed yet. Deploy the Netlify functions for /api/config.",
              );
            }

            return response.json();
          })
          .then((config) => {
            if (!config.googleClientId) {
              googleBtnWrapper.style.display = "none";
              showError(
                "Google sign-in is not configured yet. Set GOOGLE_CLIENT_ID in your environment and redeploy or restart the server.",
              );
              return;
            }
            google.accounts.id.initialize({
              client_id: config.googleClientId,
              callback: handleGoogleSignIn,
            });
            google.accounts.id.renderButton(
              document.getElementById("google-btn"),
              {
                theme: "filled_blue",
                size: "large",
                shape: "pill",
                text: "continue_with",
                width: 340,
              },
            );
          })
          .catch((error) => {
            googleBtnWrapper.style.display = "none";
            showError(
              error instanceof Error
                ? error.message
                : "Google sign-in is unavailable right now.",
            );
          });
      }

      if (typeof google !== "undefined") {
        initGoogleSignIn();
      } else {
        window.addEventListener("load", () => {
          if (typeof google !== "undefined") initGoogleSignIn();
          else {
            googleBtnWrapper.style.display = "none";
            showError("Google sign-in failed to load.");
          }
        });
      }

      async function handleGoogleSignIn(response) {
        errorEl.hidden = true;
        try {
          const res = await fetch("/api/auth/google", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ credential: response.credential }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "Google sign-in failed");
          window.location.href = "/private.html";
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.hidden = false;
        }
      }
    </script>
  </body>
</html>
