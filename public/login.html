<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login – waelio.com</title>
    <meta name="theme-color" content="#111827" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-logo">
          <svg width="48" height="48" viewBox="0 0 100 100" fill="none">
            <rect width="100" height="100" rx="20" fill="url(#g1)"/>
            <text x="50" y="62" text-anchor="middle" font-size="42" font-weight="700" fill="#fff" font-family="system-ui">W</text>
            <defs><linearGradient id="g1" x1="0" y1="0" x2="100" y2="100"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
          </svg>
        </div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your private workspace</p>

        <!-- Google Sign-In button -->
        <div id="google-btn-wrapper" class="google-signin-wrapper">
          <div id="google-btn"></div>
        </div>

        <div id="login-error" class="auth-error" hidden></div>

        <div class="auth-divider">
          <span>or sign in with password</span>
        </div>

        <form id="login-form" autocomplete="on">
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              autocomplete="username"
              placeholder="Enter your username"
              required
              autofocus
            />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            />
          </div>
          <label class="remember-row">
            <input type="checkbox" id="remember" checked />
            <span>Remember me</span>
          </label>
          <button type="submit" id="login-btn" class="btn-primary">
            Sign in
          </button>
        </form>

        <a href="/" class="auth-back">← Back to waelio.com</a>
      </div>
    </div>

    <script>
      const errorEl = document.getElementById('login-error');

      // ── Load Google Client ID and render button ────────
      function initGoogleSignIn() {
        fetch('/api/config')
          .then((r) => r.json())
          .then((config) => {
            if (!config.googleClientId) {
              document.getElementById('google-btn-wrapper').style.display = 'none';
              return;
            }
            google.accounts.id.initialize({
              client_id: config.googleClientId,
              callback: handleGoogleSignIn,
            });
            google.accounts.id.renderButton(
              document.getElementById('google-btn'),
              { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'sign_in_with', width: 340 }
            );
          })
          .catch(() => {
            document.getElementById('google-btn-wrapper').style.display = 'none';
          });
      }

      // Wait for Google library to load, then init
      if (typeof google !== 'undefined') {
        initGoogleSignIn();
      } else {
        window.addEventListener('load', () => {
          if (typeof google !== 'undefined') initGoogleSignIn();
          else document.getElementById('google-btn-wrapper').style.display = 'none';
        });
      }

      // ── Google Sign-In callback ────────────────────────
      async function handleGoogleSignIn(response) {
        errorEl.hidden = true;
        try {
          const res = await fetch('/api/auth/google', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential: response.credential }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Google sign-in failed');
          window.location.href = '/private';
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.hidden = false;
        }
      }

      // ── Password login ────────────────────────────────
      const form = document.getElementById('login-form');
      const btn = document.getElementById('login-btn');
      const usernameEl = document.getElementById('username');
      const passwordEl = document.getElementById('password');

      const saved = localStorage.getItem('waelio_user');
      if (saved) {
        usernameEl.value = saved;
        passwordEl.focus();
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.hidden = true;
        btn.disabled = true;
        btn.textContent = 'Signing in…';
        const username = usernameEl.value.trim();

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password: passwordEl.value }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Login failed');

          if (document.getElementById('remember').checked) {
            localStorage.setItem('waelio_user', username);
          } else {
            localStorage.removeItem('waelio_user');
          }
          window.location.href = '/private';
        } catch (err) {
          errorEl.textContent = err.message;
          errorEl.hidden = false;
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      });
    </script>
  </body>
</html>
