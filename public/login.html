<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login – waelio.com</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-logo">
          <img
            src="/logo.svg"
            alt="waelio logo"
            class="brand-lockup brand-lockup-auth"
          />
        </div>
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-subtitle">
          Use your approved Google account to open your private workspace.
        </p>

        <div id="google-btn-wrapper" class="google-signin-wrapper">
          <div id="google-btn"></div>
        </div>

        <div id="login-error" class="auth-error" hidden></div>

        <a href="/" class="auth-back">← Back to waelio.com</a>
        <div class="legal-links">
          <a href="/privacy.html">Privacy Policy</a>
          <a href="/terms.html">Terms of Service</a>
        </div>
      </div>
    </div>

    <script type="module" src="/login.js"></script>
  </body>
</html>
