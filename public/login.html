      gtag("js", new Date());

      gtag("config", "G-BVB8J941V9");

    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("waelio-theme");
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const themeColors = {
            dim: "#dbe1e8",
            light: "#f4f7fb",
            dark: "#171d2c",
          };
          const theme =
            storedTheme === "light" ||
            storedTheme === "dim" ||
            storedTheme === "dark"
              ? storedTheme
              : prefersDark
                ? "dark"
                : "dim";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme =
            theme === "dark" ? "dark" : "light";
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", themeColors[theme]);
        } catch {
          document.documentElement.dataset.theme = "dim";
          document.documentElement.style.colorScheme = "light";
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", "#dbe1e8");
        }
      })();
    </script>
    <link
      rel="icon"
      href="/favicon.png?v=20260502"
